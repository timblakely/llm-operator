---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: llmmodels.llm.cogito.dev
spec:
  group: llm.cogito.dev
  names:
    categories:
    - llm
    kind: LLMModel
    listKind: LLMModelList
    plural: llmmodels
    shortNames:
    - llmm
    singular: llmmodel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Model name
      jsonPath: .spec.model.name
      name: Name
      type: string
    - description: Serving backend
      jsonPath: .spec.serving.backend
      name: Backend
      type: string
    - description: Phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Currently active
      jsonPath: .status.active
      name: Active
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LLMModel is the Schema for the llmmodels API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LLMModelSpec defines the desired state of LLMModel.
            properties:
              artifact:
                description: Artifact download/cache configuration (optional, for
                  models needing materialization).
                properties:
                  expectedSize:
                    description: ExpectedSize is a human-readable size estimate (e.g.
                      "60Gi").
                    type: string
                  files:
                    description: Files lists individual files for GGUF/file-based
                      artifacts.
                    items:
                      type: string
                    type: array
                type: object
              backendRef:
                description: |-
                  Which backend deployment to use. If omitted, defaults to the backend
                  matching the serving.backend value from the cluster's LLMBackend registry.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              model:
                description: Model identity.
                properties:
                  artifactRepository:
                    description: ArtifactRepository is the upstream repo for GGUF
                      files (optional, for llama-cpp).
                    type: string
                  name:
                    description: Name is the canonical model identifier (e.g. "google/gemma-4-31B-it-qat-w4a16-ct").
                    pattern: ^[a-zA-Z0-9._/-]+$
                    type: string
                  revision:
                    description: Revision is an immutable commit SHA or tag.
                    type: string
                  source:
                    description: 'Source is the artifact location: HF repo ID for
                      vLLM/SGLang, local path for llama.cpp.'
                    minLength: 1
                    type: string
                required:
                - name
                - source
                type: object
              serving:
                description: Serving configuration.
                properties:
                  args:
                    description: |-
                      Args are backend-specific CLI arguments. Model name, revision, and served-model-name
                      are injected by the controller and must NOT be included here. Existing raw parser
                      flags remain supported for backwards compatibility; do not mix them with the
                      corresponding structured parser field.
                    items:
                      type: string
                    type: array
                  backend:
                    allOf:
                    - enum:
                      - vllm
                      - sglang
                      - llama-cpp
                    - enum:
                      - vllm
                      - sglang
                      - llama-cpp
                    description: 'Backend is the serving runtime: "vllm", "sglang",
                      or "llama-cpp".'
                    type: string
                  chatTemplate:
                    description: |-
                      ChatTemplate selects a reviewed server-side chat template for this model.
                      The referenced ConfigMap must be in the same namespace as the LLMModel
                      and its selected key must match the pinned SHA-256 digest. When omitted,
                      the runtime's model-provided template is used.
                    properties:
                      configMapKeyRef:
                        description: |-
                          ConfigMapKeyRef selects the same-namespace ConfigMap key containing the
                          UTF-8 Jinja template.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the ConfigMap or its key
                              must be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                      sha256:
                        description: |-
                          SHA256 is the lowercase hexadecimal SHA-256 digest of the selected
                          ConfigMap value. It prevents a mutable ConfigMap update from silently
                          changing an active model's prompt contract.
                        pattern: ^[a-f0-9]{64}$
                        type: string
                    required:
                    - configMapKeyRef
                    - sha256
                    type: object
                  displayName:
                    description: DisplayName is a human-readable label.
                    type: string
                  maxModelLen:
                    description: MaxModelLen is the maximum context length in tokens.
                    minimum: 1
                    type: integer
                  reasoningParser:
                    description: |-
                      ReasoningParser is a portable reasoning parser selection. The selected
                      backend driver translates it to the runtime's native configuration.
                    type: string
                  toolCallParser:
                    description: |-
                      ToolCallParser is a portable tool-call parser selection. The selected
                      backend driver translates it to the runtime's native configuration.
                    type: string
                required:
                - args
                - backend
                - displayName
                - maxModelLen
                type: object
            required:
            - model
            - serving
            type: object
            x-kubernetes-validations:
            - message: backend must be 'vllm', 'sglang', or 'llama-cpp'
              rule: self.serving.backend in ['vllm', 'sglang', 'llama-cpp']
            - message: model.name is required
              rule: has(self.model) && has(self.model.name) && size(self.model.name)
                > 0
            - message: model.source is required
              rule: has(self.model) && has(self.model.source) && size(self.model.source)
                > 0
          status:
            description: LLMModelStatus defines the observed state of LLMModel.
            properties:
              active:
                description: Active indicates this model is currently served by a
                  backend.
                type: boolean
              cacheState:
                description: CacheState describes the artifact availability.
                properties:
                  lastHydrated:
                    description: LastHydrated is when the artifact was last promoted
                      to hot cache.
                    format: date-time
                    type: string
                  location:
                    description: 'Location: "hot", "cold", "external", or "unknown".'
                    type: string
                required:
                - location
                type: object
              conditions:
                description: Conditions track subresource health.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the last reconciled generation.
                format: int64
                type: integer
              phase:
                description: Phase is the high-level lifecycle state.
                enum:
                - Pending
                - Ready
                - Active
                - Transitioning
                - Failed
                type: string
              runtimeMetadata:
                description: RuntimeMetadata captures observed runtime properties
                  after successful startup.
                properties:
                  chatTemplate:
                    description: ResolvedChatTemplate identifies the template observed
                      by the runtime.
                    properties:
                      configMapName:
                        type: string
                      key:
                        type: string
                      sha256:
                        type: string
                    required:
                    - configMapName
                    - key
                    - sha256
                    type: object
                  contextLength:
                    type: integer
                  kvCache:
                    additionalProperties:
                      type: string
                    type: object
                  launchArguments:
                    additionalProperties:
                      type: string
                    type: object
                  maxConcurrentRequests:
                    type: integer
                  observedAt:
                    format: date-time
                    type: string
                  servedModelIDs:
                    items:
                      type: string
                    type: array
                required:
                - contextLength
                - observedAt
                type: object
            required:
            - active
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

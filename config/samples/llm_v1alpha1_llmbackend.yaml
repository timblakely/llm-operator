apiVersion: llm.cogito.dev/v1alpha1
kind: LLMBackend
metadata:
  name: vllm
  namespace: llm
spec:
  type: vllm
  capacity: {gpus: 2}
  workload:
    containerName: runtime
    service:
      port: 8000
    deployment:
      replicas: 0
      strategy:
        type: Recreate
      podTemplate:
        spec:
          automountServiceAccountToken: false
          runtimeClassName: nvidia
          containers:
            - name: runtime
              image: vllm/vllm-openai:v0.25.1
              ports:
                - name: http
                  containerPort: 8000
              resources:
                requests:
                  cpu: "4"
                  memory: 24Gi
                limits:
                  memory: 96Gi
                  nvidia.com/gpu: "4"
---
apiVersion: llm.cogito.dev/v1alpha1
kind: LLMBackend
metadata:
  name: laguna
  namespace: llm
spec:
  type: llama-cpp
  capacity: {gpus: 2}
  workload:
    containerName: runtime
    service:
      port: 8000
    deployment:
      replicas: 0
      strategy:
        type: Recreate
      podTemplate:
        spec:
          automountServiceAccountToken: false
          runtimeClassName: nvidia
          containers:
            - name: runtime
              image: ghcr.io/timblakely/llama-laguna:2026-07-22
              ports:
                - name: http
                  containerPort: 8000
              resources:
                requests:
                  cpu: "22"
                  memory: 88Gi
                limits:
                  cpu: "24"
                  memory: 96Gi
                  nvidia.com/gpu: "2"

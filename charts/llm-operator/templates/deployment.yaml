apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "llm-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $podLabels := mergeOverwrite (dict) .Values.podLabels (include "llm-operator.selectorLabels" . | fromYaml) }}
        {{- toYaml $podLabels | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "llm-operator.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "llm-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cacheManager.url }}
          env:
            - name: CACHE_MANAGER_URL
              value: {{ . | quote }}
          {{- end }}
          args:
            - {{ printf "--leader-elect=%t" .Values.leaderElection.enabled | quote }}
            - {{ printf "--enable-transitions=%t" .Values.transitions.enabled | quote }}
            - {{ printf "--transition-canary-models=%s" .Values.transitions.canaryModels | quote }}
            - {{ printf "--health-probe-bind-address=%s" .Values.health.bindAddress | quote }}
            - {{ printf "--metrics-bind-address=%s" .Values.metrics.bindAddress | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: healthz
              containerPort: {{ .Values.health.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            {{- toYaml .Values.health.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            {{- toYaml .Values.health.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

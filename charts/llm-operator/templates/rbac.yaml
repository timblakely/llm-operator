{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llm-operator.fullname" . }}
  labels:
    {{- include "llm-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["llm.cogito.dev"]
    resources: ["llmactivemodels", "llmbackends", "llmmodeloverlays", "llmmodels"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["llm.cogito.dev"]
    resources:
      - llmactivemodels/status
      - llmbackends/status
      - llmmodeloverlays/status
      - llmmodels/status
    verbs: ["get", "patch", "update"]
  - apiGroups: ["llm.cogito.dev"]
    resources: ["llmmodels/finalizers"]
    verbs: ["update"]
  - apiGroups: ["llm.cogito.dev"]
    resources: ["llmbackends/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "llm-operator.fullname" . }}
  labels:
    {{- include "llm-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "llm-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

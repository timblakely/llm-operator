{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $serviceLabels := mergeOverwrite (dict) .Values.metrics.service.labels (include "llm-operator.labels" . | fromYaml) }}
    {{- toYaml $serviceLabels | nindent 4 }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.metrics.service.type }}
  selector:
    {{- include "llm-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}

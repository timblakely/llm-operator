# The manager image is deliberately digest-only. Set image.digest to a reviewed
# sha256 digest when rendering or installing the chart.
image:
  repository: ghcr.io/timblakely/llm-operator
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

rbac:
  create: true

leaderElection:
  enabled: true

# Keep this false throughout observation mode. Enabling it authorizes the
# LLMActiveModel controller to mutate referenced backend Deployments.
transitions:
  enabled: false
  # Optional comma-separated canonical model names. When non-empty, enabled
  # transitions are limited to this reviewed canary set.
  canaryModels: ""

admission:
  # Requires a serving certificate and ValidatingWebhookConfiguration.
  enabled: false

metrics:
  bindAddress: ":8081"
  port: 8081
  service:
    enabled: true
    type: ClusterIP
    port: 8081
    annotations: {}
    labels: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

health:
  bindAddress: ":8082"
  port: 8082
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

# Leave empty until the standalone cache-manager has been deployed. The
# CACHE_MANAGER_URL environment variable is omitted when this is empty.
cacheManager:
  url: ""

# The proxy is an optional data-plane component of this chart. It never shares
# the manager Pod or service account.
proxy:
  enabled: false
  image:
    repository: ghcr.io/timblakely/llm-proxy
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    name: llm-proxy
    port: 8080
    annotations: {}
    labels: {}
  serviceAccount:
    name: llm
    annotations: {}
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30
  defaultModel: ""
  publicBaseURL: ""
  activeModelRef: default
  transitionTimeout: 30m
  cacheManagerURL: ""
  backends:
    vllm: {url: "", deployment: "", container: runtime}
    llamaCPP: {url: "", deployment: "", container: runtime}
  exposure:
    httpRoute:
      enabled: false
      name: llm
      hostnames: []
      parentRefs: []
  metrics:
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

backendMetrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 10

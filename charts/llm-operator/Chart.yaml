apiVersion: v2
name: llm-operator
description: Kubernetes operator for LLM serving backends
type: application
version: 0.1.18
appVersion: "0.1.18"
kubeVersion: ">=1.28.0-0"
home: https://github.com/timblakely/llm-operator
sources:
  - https://github.com/timblakely/llm-operator
annotations:
  artifacthub.io/crds: |
    - kind: LLMModel
      version: v1alpha1
      name: llmmodels.llm.cogito.dev
    - kind: LLMModelOverlay
      version: v1alpha1
      name: llmmodeloverlays.llm.cogito.dev
    - kind: LLMActiveModel
      version: v1alpha1
      name: llmactivemodels.llm.cogito.dev
    - kind: LLMBackend
      version: v1alpha1
      name: llmbackends.llm.cogito.dev
    - kind: LLMBackend
      version: v1beta1
      name: llmbackends.llm.cogito.dev
